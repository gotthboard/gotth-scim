satisfied_at = "2026-09-03T05:42:00Z"
source_commit = "efc58063f79dda57f5eadbcb695f3783903a506b"

[feature.github-distribution.rollback]
strategy = "revert_feature_commit"
notes = "Revert the migration commit; never rewrite existing tags or mirror history"
data_loss_risk = false
requires_migration_down = false

[[feature.github-distribution.interface]]
name = "Go module import path"
kind = "api"
stability = "unstable-unreleased"
change = "breaking-module-identity"

[[feature.github-distribution.verification]]
id = "local"
kind = "unit"
command = "go mod tidy, go vet -mod=readonly ./..., and go test -mod=readonly ./..."
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0

[[feature.github-distribution.verification]]
id = "public-import"
kind = "integration"
command = "clean clone and import from github.com/gotthboard/gotth-scim"
required = true
timeout_seconds = 1200
side_effect = "external_read"
network = true
retries = 0

[[feature.github-distribution.verification]]
id = "mirror-parity"
kind = "integration"
command = "compare exact Forgejo and GitHub advertised heads and tags"
required = true
timeout_seconds = 300
side_effect = "external_read"
network = true
retries = 0
