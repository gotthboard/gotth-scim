activated_at = "2026-09-03T05:42:00Z"
updated_at = "2026-09-03T06:35:13Z"
completed_at = "2026-09-03T06:35:13Z"
folder = "workflow/features/github-distribution"
worktree = "/tmp/gotth-distribution-20260903/gotth-scim"
branch = "feature/github-distribution"
scope = ["Move the Go module and repository-owned imports to github.com/gotthboard/gotth-scim", "Document GitHub distribution and Forgejo development boundaries", "Prove clean public clone and import behavior"]
non_goals = ["Select a license", "Move or replace a tag", "Reverse the Forgejo-to-GitHub mirror", "Change repository ownership or account type"]
