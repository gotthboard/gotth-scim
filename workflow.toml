schema_version = 1
project = "gotth-scim"
profile = "strict"
active = ""

[settings]
worktree_root = "worktrees"
workflow_root = "workflow"
default_branch = "main"

[toolchain]
build = "go build ./..."
test = "go test -mod=readonly -race -cover ./..."
lint = "go vet -mod=readonly ./..."
format = "gofmt -w"
coverage = "go test -mod=readonly -coverprofile=coverage.out ./..."

[coverage]
map = "workflow/artifacts/global-coverage-map.md"
profile = "strict"
block_unresolved_high_risk = true
exception_expiry_days = 14

[feature.protocol-kernel]
id = "protocol-kernel"
slug = "protocol-kernel"
name = "Extract storage-neutral SCIM protocol kernel"
namespace = "scim"
parent = ""
state = "done"
risk = "high"
assurance = "traceable-tests"
created_at = "2026-09-03T00:32:00Z"
activated_at = "2026-09-03T00:32:00Z"
updated_at = "2026-09-03T00:52:00Z"
completed_at = "2026-09-03T00:52:00Z"
folder = "workflow/features/protocol-kernel"
worktree = "."
branch = "main"
scope = ["Extract schemas, errors, normalization, entity tags, conditional requests, PATCH/Bulk envelopes, equality filters, and persistent ID mechanics"]
non_goals = ["Copy Mailu storage/domain behavior", "Claim a complete SCIM server", "Implement HTTP, persistence, tombstones, or reconciliation in this feature"]
affected_files = ["**"]
invariants = ["Ambiguous input fails closed", "All request work is bounded", "Resource identity is opaque and persistent", "Storage and transaction policy remain adapter-owned"]
acceptance = ["RFC-backed protocol unit, failure-path, race, vet, format, and coverage gates pass", "Unimplemented server layers remain explicit"]

[feature.protocol-kernel.rollback]
strategy = "delete_unpublished_repository"
notes = "No consumer or external identity state changes during extraction"
data_loss_risk = false
requires_migration_down = false

[[feature.protocol-kernel.verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 600
side_effect = "local_write"
network = false
retries = 0

[feature.server-boundary]
id = "server-boundary"
slug = "server-boundary"
name = "Complete reusable SCIM server boundary"
namespace = "scim"
parent = ""
state = "done"
risk = "high"
assurance = "traceable-tests"
created_at = "2026-09-03T02:45:00Z"
activated_at = "2026-09-03T02:45:00Z"
updated_at = "2026-09-03T03:27:51Z"
completed_at = "2026-09-03T03:27:51Z"
folder = "workflow/features/server-boundary"
worktree = "/tmp/gotth-scim-server"
branch = "feature/server-boundary"
scope = ["Add standard resource validation, storage transactions and conformance, HTTP/Bulk execution, tombstones, and bounded reconciliation"]
non_goals = ["Choose authentication policy", "Implement a product database adapter", "Store passwords", "Import Mailu domain semantics"]
affected_files = ["**"]
invariants = ["Every mutation checks preconditions inside its transaction", "Deleted IDs are never reassigned", "Provisioning scopes remain isolated", "Reconciliation deletes only exact manager-owned resources", "All untrusted input and work are bounded"]
acceptance = ["RFC conformance matrix matches implemented behavior", "Unit, HTTP, storage conformance, failure-path, race, vet, format, coverage, clean-clone, and graph gates pass"]

[feature.server-boundary.rollback]
strategy = "reset feature branch to 557fee5 before admission; revert admitted commits after synchronization"
notes = "No live provider or consumer state changes"
data_loss_risk = false
requires_migration_down = false

[[feature.server-boundary.verification]]
id = "verify"
kind = "unit"
command = "make verify"
required = true
timeout_seconds = 900
side_effect = "local_write"
network = false
retries = 0
